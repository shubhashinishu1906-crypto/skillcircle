<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillCircle Offline</title>
    <style>
      :root {
        --bg: #f8fafc;
        --panel: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --accent: #0f172a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
        font-family: Arial, sans-serif;
        color: var(--text);
      }
      .card {
        width: min(90vw, 480px);
        background: var(--panel);
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        padding: 32px 24px;
        text-align: center;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
      }
      h1 { font-size: clamp(2rem, 5vw, 2.5rem); margin-bottom: 12px; }
      p { font-size: 1rem; color: var(--muted); line-height: 1.6; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You&apos;re offline</h1>
      <p>Some SkillCircle features need an internet connection. Cached content may still be available.</p>
    </div>
  </body>
</html>
